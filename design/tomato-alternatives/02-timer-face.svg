<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Tomato timer">
  <defs>
    <radialGradient id="tfBody" cx="0.36" cy="0.22" r="0.95">
      <stop offset="0" stop-color="#ff8f7e"/>
      <stop offset="0.34" stop-color="#ef4a42"/>
      <stop offset="0.7" stop-color="#cf2d2f"/>
      <stop offset="1" stop-color="#8c1926"/>
    </radialGradient>
    <radialGradient id="tfDial" cx="0.36" cy="0.26" r="0.9">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="0.7" stop-color="#fdf1d9"/>
      <stop offset="1" stop-color="#eddcbd"/>
    </radialGradient>
    <linearGradient id="tfLeaf" gradientUnits="userSpaceOnUse" x1="20" y1="8" x2="44" y2="24">
      <stop offset="0" stop-color="#8fdc76"/>
      <stop offset="0.5" stop-color="#4aa557"/>
      <stop offset="1" stop-color="#245f36"/>
    </linearGradient>
    <linearGradient id="tfStem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#79c963"/>
      <stop offset="1" stop-color="#2a6b39"/>
    </linearGradient>
  </defs>

  <circle cx="32" cy="37.6" r="22.2" fill="url(#tfBody)"/>
  <ellipse cx="23.4" cy="26.6" rx="7.4" ry="4.4" fill="#fff" opacity="0.22" transform="rotate(-32 23.4 26.6)"/>

  <!-- dial -->
  <circle cx="32" cy="38.4" r="16.4" fill="url(#tfDial)"/>
  <circle cx="32" cy="38.4" r="16.4" fill="none" stroke="#d9c5a2" stroke-width="0.8"/>

  <!-- ticks -->
  <g stroke="#4a4238" stroke-linecap="round">
    <g stroke-width="1.5">
      <line x1="32" y1="23.6" x2="32" y2="25.4" transform="rotate(30 32 38.4)"/>
      <line x1="32" y1="23.6" x2="32" y2="25.4" transform="rotate(60 32 38.4)"/>
      <line x1="32" y1="23.6" x2="32" y2="25.4" transform="rotate(90 32 38.4)"/>
      <line x1="32" y1="23.6" x2="32" y2="25.4" transform="rotate(120 32 38.4)"/>
      <line x1="32" y1="23.6" x2="32" y2="25.4" transform="rotate(150 32 38.4)"/>
      <line x1="32" y1="23.6" x2="32" y2="25.4" transform="rotate(210 32 38.4)"/>
      <line x1="32" y1="23.6" x2="32" y2="25.4" transform="rotate(240 32 38.4)"/>
      <line x1="32" y1="23.6" x2="32" y2="25.4" transform="rotate(270 32 38.4)"/>
      <line x1="32" y1="23.6" x2="32" y2="25.4" transform="rotate(300 32 38.4)"/>
      <line x1="32" y1="23.6" x2="32" y2="25.4" transform="rotate(330 32 38.4)"/>
    </g>
    <g stroke-width="2.1">
      <line x1="32" y1="22.9" x2="32" y2="25.4" transform="rotate(180 32 38.4)"/>
      <line x1="32" y1="22.9" x2="32" y2="25.4"/>
    </g>
  </g>

  <!-- hands: minute at 12, hour at 4 -->
  <g stroke="#3d362e" stroke-linecap="round">
    <line x1="32" y1="38.4" x2="32" y2="28.3" stroke-width="2.2"/>
    <line x1="32" y1="38.4" x2="37.6" y2="42.8" stroke-width="2.9"/>
  </g>
  <circle cx="32" cy="38.4" r="2.2" fill="#3d362e"/>
  <circle cx="32" cy="38.4" r="0.9" fill="#f3e3c6"/>

  <!-- calyx -->
  <g>
    <path d="M32 20.4c-4.6 1.6-8.6 4.6-11.2 8.6 3.9.7 7.8-.5 10.4-3.1z" fill="url(#tfLeaf)"/>
    <path d="M32 20.4c4.6 1.6 8.6 4.6 11.2 8.6-3.9.7-7.8-.5-10.4-3.1z" fill="url(#tfLeaf)"/>
    <path d="M32 20.2c-2.4-1.6-4.6-3.9-6.2-6.6 3.2.3 5.8 1.5 7.4 3.3z" fill="url(#tfLeaf)"/>
    <path d="M32 20.2c2.4-1.6 4.6-3.9 6.2-6.6-3.2.3-5.8 1.5-7.4 3.3z" fill="url(#tfLeaf)"/>
    <path d="M31 20.6c-.9-3.3-.3-7 .9-9.9" fill="none" stroke="url(#tfStem)" stroke-width="2.9" stroke-linecap="round"/>
  </g>
</svg>
